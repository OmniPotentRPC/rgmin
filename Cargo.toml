[package]
name = "rgmin"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local first-order minimization and Riemannian steppers."
repository = "https://github.com/OmniPotentRPC/rgmin"
readme = "README.md"
keywords = ["optimization", "conjugate-gradient", "linesearch"]
categories = ["science", "mathematics"]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]

[lib]
name = "rgmin"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
capi = []
par = ["dep:rayon"]
highs = ["dep:highs", "dep:highs-sys"]

[dependencies]
eindir-core = { version = "0.6.0", git = "https://github.com/HaoZeke/eindir.git", rev = "f3c42130bb389ba6cd6e4cfdc8b2e182f4a764e9", features = ["capi"] }
dlpk = { version = "0.1.5", features = ["ndarray"] }
ndarray = "0.17"
thiserror = "2"
rand = "0.9"
rayon = { version = "1.10", optional = true }
highs = { version = "2.1", optional = true }
highs-sys = { version = "1.12", optional = true }

[dev-dependencies]
approx = "0.5"
proptest = "1"
rgpot-core = { package = "rgpot-core", git = "https://github.com/OmniPotentRPC/rgpot.git", rev = "b19227f9197a4c927633f1225f1e7546794a6f1e" }

[build-dependencies]
cbindgen = "0.29"

[package.metadata.capi]
min_version = "0.10.17"

[package.metadata.capi.header]
name = "rgmin.h"
subdirectory = ""
# cbindgen output is not the installed header. It exports the internal
# HiGHS imports (undefined HighsInt), wraps callbacks as Option_ structs,
# and cargo-c turns the filename rgmin.h into the token RGMIN.H_MAJOR.
generation = false
enabled = true
emit_version_constants = false

[package.metadata.capi.install.include]
asset = [
    { from = "include/**/*.h", to = "" },
    { from = "include/**/*.hpp", to = "" },
]

[package.metadata.capi.pkg_config]
name = "rgmin"
filename = "rgmin"
description = "Local first-order minimization C ABI"

[package.metadata.capi.library]
name = "rgmin"

[[example]]
name = "compare_highs"
required-features = ["highs"]

[[example]]
name = "ffi_throughput"
required-features = ["capi"]

[[example]]
name = "strong_scale"
required-features = ["par"]

[[bench]]
name = "stop_norm"
harness = false

[[bench]]
name = "holonomic"
harness = false


[profile.release]
lto = "thin"
codegen-units = 1
