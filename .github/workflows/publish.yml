name: publish

on:
  push:
    tags:
      - '*'
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
      - name: Publish rgmin
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify -p rgmin
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 
    github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 
    'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}
