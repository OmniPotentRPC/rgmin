name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "llms.txt"
      - "llms-full.txt"
      - "scripts/generate_docs_inventory.py"
      - "scripts/check_links.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "llms.txt"
      - "llms-full.txt"
      - "scripts/generate_docs_inventory.py"
      - "scripts/check_links.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# A pull request gets its own group, so it never cancels a Pages deploy.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y emacs-nox
      - name: Public API coverage and generated LLM files
        run: python3 scripts/generate_docs_inventory.py --check
      - name: Export the org sources to reStructuredText
        run: emacs --batch -l export.el
        working-directory: docs
      # The rst under docs/source is tracked. A change to an org page that
      # was not re-exported, or a page nobody added, fails here.
      - name: Exported rst is current
        run: |
          git add --intent-to-add docs/source
          git diff --exit-code --stat -- docs/source
      - run: python -m pip install -q "sphinx>=8,<8.1" shibuya sphinxcontrib-bibtex myst-parser
      - run: python docs/render_performance.py
      - run: sphinx-build -b html -n -W --keep-going docs/source docs/build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DOIs and URLs in the tracked sources
        run: python3 scripts/check_links.py
  deploy:
    needs: build
    # Job permissions replace the workflow set, so read is repeated.
    permissions:
      contents: read
      pages: write
      id-token: write
    # The github-pages environment accepts main and gh-pages only.
    # A pull request still runs the export and the Sphinx build.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
