name: verify

on:
  push:
    branches:
      - main
      - "feat/**"
      - "verify/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal:
    name: formal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache the Lake build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: formal/.lake
          key: lake-${{ hashFiles('formal/lake-manifest.json', 'formal/lean-toolchain') }}
          restore-keys: lake-${{ hashFiles('formal/lake-manifest.json', 'formal/lean-toolchain') }}-
      - name: Machine-check the contracts
        working-directory: formal
        run: ./check.sh

  validation:
    name: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install Sollya
        run: sudo apt-get update && sudo apt-get install -y sollya
      - name: Exported constants match the Rust sources
        run: python3 scripts/export_constants.py --check
      - name: SymPy scripts
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for f in validation/*.py; do
            found=1
            uv run --no-project --with sympy --with mpmath python "$f"
          done
          test "$found" -eq 1
      - name: Sollya scripts
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for f in validation/*.sollya; do
            found=1
            sollya "$f"
          done
          test "$found" -eq 1
