name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: cargo test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: capi
            args: --features capi
          - name: highs
            args: --features highs
          - name: all-features
            args: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Python reference dependencies
        run: python -m pip install -q numpy scipy
      - run: cargo build --locked ${{ matrix.args }}
      - run: cargo test --locked ${{ matrix.args }}
      - name: Public docs and C ABI names
        if: matrix.name == 'default'
        run: |
          python3 scripts/check_public_docs.py
          python3 scripts/check_abi.py
      - name: Tutorial examples
        if: matrix.name == 'default'
        run: |
          for ex in tutorial_lbfgs tutorial_fire tutorial_cg tutorial_bfgs tutorial_newton tutorial_scg tutorial_linesearch tutorial_lbfgs_direction; do
            cargo run --locked --quiet --example "$ex"
          done

  python:
    name: ASE drop-in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y python3-dev pkg-config
      - run: python -m pip install -q maturin numpy "ase>=3.23" pytest
      - name: Build and install the wheel
        working-directory: python
        run: maturin build --release -o target/wheels
      - run: python -m pip install --force-reinstall python/target/wheels/*.whl
      - run: python -m pytest python/tests -q --import-mode=importlib
      - name: Tutorial example
        run: python examples/tutorial_lowest_eigenpairs.py

  lammps:
    name: LAMMPS min_style rgmin (${{ matrix.lammps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The first stable release that loads min styles from plugins,
        # and the current one.
        lammps: [stable_22Jul2025_update2, stable_30Sep2026_update1]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - uses: actions/cache@v4
        id: lammps-cache
        with:
          path: ~/lammps
          key: lammps-${{ matrix.lammps }}-mpi-manybody-plugin-v1
      - name: Build LAMMPS (MPI, MANYBODY, PLUGIN)
        if: steps.lammps-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/lammps
          curl -sSfL "https://github.com/lammps/lammps/archive/refs/tags/${{ matrix.lammps }}.tar.gz" \
            | tar xz -C ~/lammps --strip-components=1
          cmake -S ~/lammps/cmake -B ~/lammps/build -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_MPI=on -D BUILD_OMP=off -D BUILD_SHARED_LIBS=on \
            -D PKG_PLUGIN=on -D PKG_MANYBODY=on \
            -D WITH_JPEG=off -D WITH_PNG=off -D WITH_FFMPEG=off -D WITH_GZIP=off
          cmake --build ~/lammps/build -j "$(nproc)"
          rm -rf ~/lammps/doc ~/lammps/examples ~/lammps/bench ~/lammps/tools ~/lammps/unittest
      - run: cargo build --release --locked --lib --features capi
      - name: Build the plugin against the rgmin staticlib
        run: |
          cmake -S lammps -B build-lammps -D CMAKE_BUILD_TYPE=Release \
            -D LAMMPS_SOURCE_DIR="$HOME/lammps/src" \
            -D RGMIN_LIBRARY="$PWD/target/release/librgmin.a" \
            -D RGMIN_LAMMPS_LMP="$HOME/lammps/build/lmp" \
            -D Python3_EXECUTABLE="$(which python)"
          cmake --build build-lammps
      - run: python -m pip install -q pytest
      - name: Plugin tests (1, 2 and 4 MPI ranks)
        run: |
          export LAMMPS_POTENTIALS="$HOME/lammps/potentials"
          export RGMIN_LAMMPS_MPIRUN="mpirun --oversubscribe"
          ctest --test-dir build-lammps --output-on-failure

  strong-scale:
    name: strong_scale smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked --features par --example strong_scale -- --cells 2 --repeats 1 --max-threads 2

  clippy:
    name: clippy (${{ matrix.toolchain }}, ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.88.0, stable]
        name: [default, capi, highs, all-features]
        include:
          - name: default
            args: ""
          - name: capi
            args: --features capi
          - name: highs
            args: --features highs
          - name: all-features
            args: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets ${{ matrix.args }} -- -D warnings

  cinstall:
    name: cargo cinstall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-c
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 install cargo-c --locked --version 0.10.17+cargo-0.92.0
      - name: Install into a prefix and compile C and C++
        run: tests/cinstall/smoke.sh
