name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "ci/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --features par,capi --all-targets -- -D warnings

  test:
    name: cargo test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: capi
            args: --features capi
          - name: highs
            args: --features highs
          - name: all-features
            args: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Python reference dependencies
        run: python -m pip install -q numpy scipy
      - name: Build the libraries the C header tests link
        run: cargo build --locked ${{ matrix.args }}
      - run: cargo test --locked ${{ matrix.args }}
