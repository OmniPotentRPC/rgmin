name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "ci/**"
      - "perf/**"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: cargo test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
            readcon: "0"
          - name: capi
            args: --features capi
            readcon: "0"
          - name: highs
            args: --features highs
            readcon: "0"
          # Named features, not `--all-features`. The `readcon` feature
          # is a separate row so this staticlib does not link it.
          - name: all-features
            args: --features capi,par,highs,slepc,primme,chase,libkrylov
            readcon: "0"
          - name: readcon
            args: --features readcon
            readcon: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Python reference dependencies
        run: python -m pip install -q numpy scipy
      - name: Build the libraries the C header tests link
        run: cargo build --locked ${{ matrix.args }}
      - name: Staticlib readcon link
        run: |
          lib=target/debug/librgmin.a
          # `readcon_core` is the crate. A bare `readcon` match also hits
          # `ThreadConfig` inside matrixmultiply.
          if [ "${{ matrix.readcon }}" = "1" ]; then
            nm -a "$lib" | grep -q readcon_core
          elif nm -a "$lib" | grep -E 'readcon_core|readcon-core'; then
            echo "this row links readcon"
            exit 1
          fi
      - run: cargo test --locked ${{ matrix.args }}
      - name: Public docs and C ABI names
        if: matrix.name == 'default'
        run: |
          python3 scripts/check_public_docs.py
          python3 scripts/check_abi.py
      - name: Tutorial examples
        if: matrix.name == 'default'
        run: |
          for ex in tutorial_lbfgs tutorial_fire tutorial_cg tutorial_bfgs tutorial_newton tutorial_scg tutorial_linesearch tutorial_lbfgs_direction; do
            cargo run --locked --quiet --example "$ex"
          done

  python:
    name: ASE drop-in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y python3-dev pkg-config
      - run: python -m pip install -q maturin numpy "ase>=3.23" pytest
      - name: Build and install the wheel
        working-directory: python
        run: maturin build --release -o target/wheels
      - run: python -m pip install --force-reinstall python/target/wheels/*.whl
      - run: python -m pytest python/tests -q --import-mode=importlib
      - name: Tutorial example
        run: python examples/tutorial_lowest_eigenpairs.py

  strong-scale:
    name: strong_scale smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked --features par --example strong_scale -- --cells 2 --repeats 1 --max-threads 2

  clippy:
    name: clippy (${{ matrix.toolchain }}, ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.88.0, stable]
        name: [default, capi, highs, all-features]
        include:
          - name: default
            args: ""
          - name: capi
            args: --features capi
          - name: highs
            args: --features highs
          - name: all-features
            args: --features capi,par,highs,slepc,primme,chase,libkrylov
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets ${{ matrix.args }} -- -D warnings

  # Forcing tests. A clone this runner cannot execute is "not exercised"
  # in the test log. The scalar path is always forced.
  isa:
    name: isa forcing (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x86_64-1.88
            os: ubuntu-latest
            toolchain: 1.88.0
          - name: ubuntu-x86_64-1.89
            os: ubuntu-latest
            toolchain: 1.89.0
          - name: ubuntu-arm64-1.88
            os: ubuntu-24.04-arm
            toolchain: 1.88.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: CPU flags
        run: |
          grep -m1 flags /proc/cpuinfo || true
          lscpu || true
          sysctl -n machdep.cpu.brand_string || true
      - name: Force every compiled clone, serial
        run: cargo test --locked --features simd --test vecops_isa -- --nocapture
      - name: Force every compiled clone, par
        run: cargo test --locked --features simd,par --test vecops_isa -- --nocapture

  # Unstripped simd libraries for the static ISA audit.
  # LTO is off so each multiversion clone keeps its own symbol.
  # 1.89 emits the avx512f clone. That is not a target-cpu flag.
  isa-build:
    name: unstripped simd libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          targets: aarch64-unknown-linux-gnu
      - name: aarch64 linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: CPU flags
        run: |
          grep -m1 flags /proc/cpuinfo || true
          lscpu || true
      - name: x86_64 release library
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
        run: cargo build --release --locked --features simd
      - name: aarch64 release library
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --features simd --target aarch64-unknown-linux-gnu
      - name: Stage the rgmin object files
        run: |
          mkdir -p isa-staging/x86_64 isa-staging/aarch64
          rm -rf isa-extract
          mkdir -p isa-extract/x86 isa-extract/arm
          (cd isa-extract/x86 && ar x "$GITHUB_WORKSPACE/target/release/librgmin.a")
          (cd isa-extract/arm && ar x "$GITHUB_WORKSPACE/target/aarch64-unknown-linux-gnu/release/librgmin.a")
          cp isa-extract/x86/rgmin*.o isa-staging/x86_64/
          cp isa-extract/arm/rgmin*.o isa-staging/aarch64/
      - uses: actions/upload-artifact@v4
        with:
          name: unstripped-libs
          path: isa-staging/

  isa-audit:
    name: isa audit
    needs: isa-build
    uses: OmniPotentRPC/rgpot/.github/workflows/isa-audit.yml@06638f2ece83b12731b387ba819b67dc2151556b
    with:
      artifact-name: unstripped-libs
      allow-file: isa-allow.toml

  cinstall:
    name: cargo cinstall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-c
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 install cargo-c --locked --version 0.10.17+cargo-0.92.0
      - name: Install into a prefix and compile C and C++
        run: tests/cinstall/smoke.sh
