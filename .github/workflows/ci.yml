name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: cargo test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: capi
            args: --features capi
          - name: highs
            args: --features highs
          - name: all-features
            args: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Python reference dependencies
        run: python -m pip install -q numpy scipy
      - run: cargo build --locked ${{ matrix.args }}
      - run: cargo test --locked ${{ matrix.args }}

  strong-scale:
    name: strong_scale smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked --features par --example strong_scale -- --cells 2 --repeats 1 --max-threads 2

  clippy:
    name: clippy (${{ matrix.toolchain }}, ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.88.0, stable]
        name: [default, capi, highs, all-features]
        include:
          - name: default
            args: ""
          - name: capi
            args: --features capi
          - name: highs
            args: --features highs
          - name: all-features
            args: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets ${{ matrix.args }} -- -D warnings

  cinstall:
    name: cargo cinstall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-c
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 install cargo-c --locked --version 0.10.17+cargo-0.92.0
      - name: Install into a prefix and compile C and C++
        run: tests/cinstall/smoke.sh

  abi:
    name: abidiff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install libabigail
        run: sudo apt-get update && sudo apt-get install -y abigail-tools
      - run: scripts/abi_check.sh

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install -q maturin numpy ase pytest
      - run: maturin develop --release
        working-directory: python
      - run: python docs/examples/quadratic.py
      - run: python -m pytest tests/python

  guide:
    name: guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install -q "sphinx>=8,<8.1" myst-parser
      - run: python scripts/check_docstrings.py
      - run: python scripts/check_prose.py
      - run: sphinx-build -W --keep-going -b html docs/guide docs/guide/_build
      - run: sphinx-build -W --keep-going -b linkcheck docs/guide docs/guide/_linkcheck
      - run: cargo run --locked --example quadratic

