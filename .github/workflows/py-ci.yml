name: Python binding CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "feat/**"
      - "fix/**"
      - "ci/**"
      - "perf/**"
    paths:
      - "python/**"
      - "include/rgbind/**"
      - "include/rgmin/optimize.hpp"
      - "include/rgmin.h"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "cbindgen.toml"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "tests/python/**"
      - "examples/**"
      - "ci/limit_pe_exports.py"
      - "ci/tsan_native.sh"
      - "ci/tsan_suppressions.txt"
      - ".github/workflows/py-ci.yml"
  pull_request:
    paths:
      - "python/**"
      - "include/rgbind/**"
      - "include/rgmin/optimize.hpp"
      - "include/rgmin.h"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "cbindgen.toml"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "tests/python/**"
      - "examples/**"
      - "ci/limit_pe_exports.py"
      - "ci/tsan_native.sh"
      - "ci/tsan_suppressions.txt"
      - ".github/workflows/py-ci.yml"
  workflow_dispatch:

concurrency:
  group: py-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One rgpot commit for the five workflows and rgpot-ref: rgpot tests
  # the workflows together at a commit, and rgbind-sync compares the
  # vendored header with the rgpot that runs the other jobs.
  wheels:
    uses: OmniPotentRPC/rgpot/.github/workflows/py-wheels.yml@e34a43b63a69ccc88bc63692001cafc273992082
    with:
      package-dir: .
      import-names: rgmin._core
      test-path: tests/python
      extras: test

  freethreading:
    uses: OmniPotentRPC/rgpot/.github/workflows/py-freethreading.yml@e34a43b63a69ccc88bc63692001cafc273992082
    with:
      package-dir: .
      import-names: rgmin._core
      test-path: tests/python
      extras: test
      iterations: "20"
      rust-crate-dir: .

  tsan:
    uses: OmniPotentRPC/rgpot/.github/workflows/py-tsan.yml@e34a43b63a69ccc88bc63692001cafc273992082
    with:
      package-dir: .
      import-names: rgmin._core
      test-path: tests/python
      extras: test
      rust-crate-dir: .
      rust-toolchain: nightly-2026-01-20
      tsan-cmake-args: -DRGMIN_TSAN=ON

  # The tsan job above runs in a container image. This one needs none: it
  # builds a free-threaded CPython and NumPy with ThreadSanitizer on the
  # runner, then rgmin with -fsanitize=thread and a Rust staticlib built
  # with -Zsanitizer=thread, and runs the ASE contract and threaded tests
  # with halt_on_error=1. ci/tsan_suppressions.txt lists each suppression
  # and why it is there.
  tsan-native:
    name: TSan native (CPython 3.14t)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CPYTHON_VERSION: "3.14.10"
      RUST_TOOLCHAIN: nightly-2026-01-20
      TSAN_WORK: ${{ github.workspace }}/.tsan-work
      TSAN_LOG: ${{ github.workspace }}/tsan.log
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Lower vm.mmap_rnd_bits for TSan
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w vm.mmap_rnd_bits=28
          sudo sysctl -n vm.mmap_rnd_bits

      - name: Install build packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang g++ pkg-config libffi-dev libssl-dev \
            zlib1g-dev libsqlite3-dev libbz2-dev liblzma-dev libreadline-dev libopenblas-dev \
            ca-certificates curl xz-utils binutils
          major="$(clang -dumpversion | cut -d. -f1)"
          sudo apt-get install -y "libclang-rt-${major}-dev" "llvm-${major}"
          echo "SYMBOLIZER=$(ls /usr/lib/llvm-${major}/bin/llvm-symbolizer)" >> "${GITHUB_ENV}"

      - name: Cache the TSan interpreter and NumPy
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tsan-work/python
            .tsan-work/venv
          key: tsan-native-${{ runner.os }}-${{ runner.arch }}-${{ env.CPYTHON_VERSION }}-${{ hashFiles('ci/tsan_native.sh') }}

      - name: Build under ThreadSanitizer and run the tests
        shell: bash
        run: ci/tsan_native.sh

      - name: Keep the TSan log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tsan-native-log
          path: tsan.log
          if-no-files-found: ignore

  typing:
    uses: OmniPotentRPC/rgpot/.github/workflows/py-typing.yml@e34a43b63a69ccc88bc63692001cafc273992082
    with:
      package-dir: .
      import-names: rgmin._core
      stub-dir: python
      typecheck-paths: python/rgmin examples
      extras: test
      rust-crate-dir: .

  rgbind-sync:
    uses: OmniPotentRPC/rgpot/.github/workflows/py-rgbind-sync.yml@e34a43b63a69ccc88bc63692001cafc273992082
    with:
      vendored-path: include/rgbind/rgbind.hpp
      rgpot-ref: e34a43b63a69ccc88bc63692001cafc273992082

  ase-contract:
    name: ASE ${{ matrix.ase }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - ase: "3.23.0"
            spec: "ase==3.23.0"
          - ase: "3.29.0"
            spec: "ase==3.29.0"
          - ase: "main"
            spec: "ase @ git+https://gitlab.com/ase/ase.git@8d127bc9beff6fb4f3a38c7e439624d73904527c"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: Install rgmin and this ASE
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install 'nanobind>=3.1' scikit-build-core cmake ninja pytest pytest-timeout hypothesis numpy
          python -m pip install "${{ matrix.spec }}"
          python -m pip install --no-build-isolation .

      - name: ASE contract tests
        shell: bash
        run: python -m pytest -q tests/python/test_ase.py tests/python/test_ase_stops.py tests/python/test_ase_upstream.py --timeout=180 -o faulthandler_timeout=120
