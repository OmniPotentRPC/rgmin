[package]
name = "rgmin-py"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Python bindings for rgmin."

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
ndarray = "0.17"
numpy = "0.24"
pyo3 = { version = "0.24", features = ["extension-module"] }
rgmin = { path = ".." }
