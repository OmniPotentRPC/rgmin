# Dispatched vector kernels. Baseline outside these symbols stays
# x86-64 (v1) and armv8-a. FMA is not listed: the clones do not enable it.
# AVX-512 is avx512f only, and only on rustc >= 1.89.

[[allow]]
symbol = 'rgmin::vecops::.*avx2_version.*'
features = ["avx", "avx2"]
reason = "multiversion x86_64+avx2 clone and the direct avx2 shim"

[[allow]]
symbol = 'rgmin::vecops::.*avx512(f)?_version.*'
features = ["avx", "avx2", "avx512f"]
reason = "multiversion x86_64+avx512f clone and the direct avx512f shim"

[[allow]]
symbol = 'rgmin::vecops::.*sve_version.*'
features = ["sve"]
reason = "multiversion aarch64+sve clone and the direct sve shim"
