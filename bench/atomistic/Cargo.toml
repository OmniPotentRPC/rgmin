[package]
name = "rgmin-atomistic-bench"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "rgmin on real rgpot potentials: oracle calls, iterations, and per-iteration overhead."

# Standalone: not a member of any parent workspace.
[workspace]

[dependencies]
rgmin = { path = "../.." }
rgpot-core = "3.4.0"
eindir-core = { version = "0.6.0", features = ["capi"] }
dlpk = "0.1.5"
ndarray = "0.17"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
