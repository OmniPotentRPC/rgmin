# Manual cbindgen config. cargo cinstall does not install this output.
# package.metadata.capi.header.generation is false. The installed header
# is include/rgmin.h, with include/dlpack/dlpack.h beside it.
language = "C"
include_guard = "RGMIN_OPTIMIZE_H"
include_version = false
pragma_once = true
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. */"
after_includes = "#include <dlpack/dlpack.h>"
cpp_compat = true
line_length = 80
tab_width = 4
documentation = true
documentation_style = "Doxy"
line_endings = "LF"

[export]
# Internal HiGHS imports in src/lbfgs_qp.rs. They are not the public ABI,
# and HighsInt is not defined in this header.
exclude = ["Highs_setCallback", "Highs_startCallback"]
