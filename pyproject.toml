[build-system]
requires = ["scikit-build-core>=1.1", "nanobind>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "rgmin"
dynamic = ["version"]
description = "Free-threaded geometry optimizer: a nanobind wheel around the rgmin staticlib."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohit Goswami", email = "rgoswami@ieee.org" }]
keywords = ["optimization", "geometry-optimization", "lbfgs", "fire", "ase", "free-threading"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading",
  "Programming Language :: Python :: Free Threading :: 3 - Stable",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/OmniPotentRPC/rgmin"
Documentation = "https://omnipotentrpc.github.io/rgmin/"
Repository = "https://github.com/OmniPotentRPC/rgmin"
Issues = "https://github.com/OmniPotentRPC/rgmin/issues"
Changelog = "https://github.com/OmniPotentRPC/rgmin/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ase = ["ase>=3.23"]
test = [
  "pytest>=7",
  "pytest-timeout>=2",
  "pytest-run-parallel>=0.4",
  "hypothesis>=6",
  "numpy>=1.24",
  "ase>=3.23",
]

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.15"
# GIL builds: cp312-abi3 covers CPython 3.12 through 3.15.
# Free-threaded interpreters ignore the classic abi3 tag and emit
# cp314-cp314t or cp315-cp315t instead.
wheel.py-api = "cp312"
wheel.packages = ["python/rgmin"]

# The wheel version is the crate's [package] version, the one that
# rgmin.__version__ reports and that a v* release tag names.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "Cargo.toml"
regex = '(?ms)^\[package\]$.*?^version = "(?P<value>[^"]+)"$'

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp314t-* cp315t-*"
skip = ["pp*", "*-musllinux*", "*_i686", "*-win32"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
test-requires = ["pytest", "pytest-timeout", "numpy", "ase>=3.23", "hypothesis>=6"]
# The first command is the F1 check of rgpot's wheel workflow: on a
# free-threaded interpreter, importing rgmin._core must leave the GIL off.
# The suite's GIL test skips when the pytest process holds the GIL, so it
# passes over an import that turned the GIL back on.
test-command = [
  "python -W error::RuntimeWarning -c \"import sys, sysconfig, rgmin._core; assert not sysconfig.get_config_var('Py_GIL_DISABLED') or not sys._is_gil_enabled()\"",
  "python -m pytest -q tests/python --timeout=180 -o faulthandler_timeout=120",
]
test-sources = ["tests/python"]

[tool.cibuildwheel.linux]
before-all = """
yum install -y git || dnf install -y git
curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
ln -sfn "$HOME/.cargo/bin/cargo" /usr/local/bin/cargo
ln -sfn "$HOME/.cargo/bin/rustc" /usr/local/bin/rustc
ln -sfn "$HOME/.cargo/bin/rustup" /usr/local/bin/rustup
"""
environment = { PATH = "/root/.cargo/bin:$PATH" }

[[tool.cibuildwheel.overrides]]
select = "*-manylinux_aarch64"
# Under qemu-aarch64 -cpu max, AT_HWCAP2 advertises SME without the
# 512-bit streaming vector length that scipy-openblas 0.3.34's
# armv9sme dgemm assumes, so transposed products drop rows.
test-environment = { OPENBLAS_CORETYPE = "ARMV8" }

[tool.cibuildwheel.macos]
archs = ["arm64"]
# Homebrew on the macos-15 runner builds its libraries for 15.0, and
# delocate rejects them under a 14.0 target. The extension links only
# the Rust staticlib and system libraries, so the tag stays macosx_14_0.
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0", PATH = "$HOME/.cargo/bin:$PATH" }
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal"

[tool.cibuildwheel.windows]
before-all = "curl -sSf -o %TEMP%\\rustup-init.exe https://win.rustup.rs/x86_64 && %TEMP%\\rustup-init.exe -y --default-toolchain stable --profile minimal"
environment = { PATH = "$USERPROFILE\\.cargo\\bin;$PATH" }

[tool.pytest.ini_options]
markers = [
  "iterations(n): repeat a test under pytest-run-parallel",
  "thread_unsafe: run single-threaded under pytest-run-parallel",
]

[tool.mypy]
mypy_path = "python"
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = "rgmin._core"
disallow_any_generics = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["ase", "ase.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["examples", "python/rgmin"]
extraPaths = ["python"]
typeCheckingMode = "standard"
pythonVersion = "3.10"
reportMissingModuleSource = "none"
reportMissingImports = "none"
